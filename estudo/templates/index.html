<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Calculadora de IMC</h1>
    <p>Descubra seu Índice de Massa Corporal preenchendo os campos abaixo.</p>

    <form action="/resultado" method="POST">
      <label>Nome:</label><br>
      <input type="text" name="nome" required><br>

      <label>Peso (kg):</label><br>
      <input type="number" name="peso" step="0.1" required><br>

      <label>Altura (m):</label><br>
      <input type="number" name="altura" step="0.01" required><br>

      <button type="submit">Calcular</button>
    </form>

    <br>
    <a href="/autor">Sobre o Autor</a>
  </div>
</body>
</html>
